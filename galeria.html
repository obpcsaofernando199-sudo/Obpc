<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria — OBPC Jardim São Fernando</title>
<meta property="og:title" content="Galeria de Fotos — OBPC Jardim São Fernando">
<meta property="og:description" content="Momentos da nossa congregação">
<meta property="og:image" content="https://obpcsaofernando199-sudo.github.io/Obpc/og-banner.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b2e;--deep:#08121f;--gold:#c9a24b;--soft:#e6cd8a;--cream:#f3ede0;--line:rgba(201,162,75,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(ellipse at top,#14273f 0,var(--navy) 45%,var(--deep) 100%) fixed;color:var(--cream);font-family:'Jost',sans-serif;min-height:100vh}
.voltar{position:absolute;top:16px;left:16px;color:var(--soft);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:7px 14px;border-radius:30px;background:rgba(8,18,31,.5)}
header{text-align:center;padding:62px 20px 22px}
header::after{content:"";display:block;width:64px;height:2px;background:var(--gold);margin:18px auto 0;opacity:.7}
.eyebrow{letter-spacing:4px;text-transform:uppercase;font-size:12px;color:var(--soft)}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5vw,44px);margin:10px 0 6px}
header p{margin:0;font-size:14px;color:rgba(243,237,224,.6);font-style:italic;font-family:'Fraunces',serif}
.filtros{display:flex;gap:8px;overflow-x:auto;padding:6px 20px 24px;justify-content:center;flex-wrap:wrap}
.filtro{background:transparent;border:1px solid var(--line);color:var(--soft);padding:8px 16px;border-radius:30px;font:13px 'Jost',sans-serif;cursor:pointer;white-space:nowrap}
.filtro.on{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:500}
.filtro small{opacity:.7;margin-left:4px}
.galeria{columns:4 250px;column-gap:14px;max-width:1300px;margin:0 auto;padding:0 16px 20px}
.card{break-inside:avoid;margin-bottom:14px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line);cursor:pointer;background:#0a1727}
.card img{width:100%;display:block;min-height:90px;transition:transform .5s}
.card:hover img{transform:scale(1.04)}
.leg{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(to top,rgba(6,12,20,.92),transparent);font-size:12.5px;color:var(--soft);opacity:0;transition:.3s}
.card:hover .leg{opacity:1}
.mais{display:block;margin:0 auto 50px;background:rgba(201,162,75,.12);border:1px solid var(--gold);color:var(--soft);padding:11px 28px;border-radius:30px;font:14px 'Jost',sans-serif;cursor:pointer}
.vazio{text-align:center;color:rgba(243,237,224,.45);font-style:italic;font-family:'Fraunces',serif;padding:40px 20px}
.lb{position:fixed;inset:0;background:rgba(5,10,18,.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99;padding:16px;gap:12px}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:70vh;border-radius:8px;border:1px solid var(--line);touch-action:pan-y}
.lb-leg{color:var(--soft);font-family:'Fraunces',serif;font-style:italic;font-size:15px;text-align:center;max-width:600px}
.lb-acoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:rgba(201,162,75,.12);border:1px solid var(--line);color:var(--soft);padding:9px 18px;border-radius:30px;font:13px 'Jost',sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--gold);color:var(--deep)}
.nav{position:fixed;background:rgba(201,162,75,.12);border:1px solid var(--line);color:var(--soft);font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer}
.fechar{top:16px;right:16px}.prev{top:50%;left:12px;transform:translateY(-50%)}.next{top:50%;right:12px;transform:translateY(-50%)}
.aviso{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--deep);padding:10px 20px;border-radius:30px;font-size:13px;font-weight:500;display:none;z-index:100}
footer{text-align:center;padding:10px 20px 40px;font-size:12px;color:rgba(243,237,224,.35)}
@media(max-width:600px){.galeria{columns:2 150px;column-gap:10px;padding:0 10px}.card{margin-bottom:10px}.nav{width:38px;height:38px;font-size:18px}.leg{opacity:1}}
</style>
</head>
<body>
<a class="voltar" href="index.html">← Voltar ao site</a>
<header>
  <div class="eyebrow">OBPC Jardim São Fernando</div>
  <h1>Galeria de Fotos</h1>
  <p>Momentos da nossa congregação</p>
</header>
<div class="filtros" id="filtros"></div>
<div class="galeria" id="galeria"></div>
<div class="vazio" id="vazio" style="display:none">Nenhuma foto encontrada.</div>
<button class="mais" id="mais" style="display:none">Carregar mais fotos</button>

<div class="lb" id="lb">
  <button class="nav fechar" onclick="fechar()" aria-label="Fechar">✕</button>
  <button class="nav prev" onclick="nav(-1)" aria-label="Anterior">‹</button>
  <button class="nav next" onclick="nav(1)" aria-label="Próxima">›</button>
  <img id="lb-img" alt="">
  <div class="lb-leg" id="lb-leg"></div>
  <div class="lb-acoes">
    <button class="btn" onclick="compartilhar()">📤 Compartilhar</button>
    <a class="btn" id="lb-baixar" target="_blank" rel="noopener" download>⬇ Baixar</a>
  </div>
</div>
<div class="aviso" id="aviso"></div>
<footer>Igreja Evangélica Pentecostal O Brasil para Cristo — Congregação Jardim São Fernando</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBwrxwxOVAkMuxg3KrBokms7DvVtZisRNM",
  authDomain: "obpc-saofernando-1d6f3.firebaseapp.com",
  databaseURL: "https://obpc-saofernando-1d6f3-default-rtdb.firebaseio.com",
  projectId: "obpc-saofernando-1d6f3",
  storageBucket: "obpc-saofernando-1d6f3.firebasestorage.app",
  messagingSenderId: "338504197999",
  appId: "1:338504197999:web:bef16273d1a7135da8ea9a"
});
const db = getDatabase(app);

const NOMES = {todas:"Todas",cultos:"Cultos",missoes:"Missões","santa-ceia":"Santa Ceia",familia:"Família",jubrac:"Jubrac",umasbrac:"Umasbrac",ufebrac:"Ufebrac",menibrac:"Menibrac"};
const POR_PAGINA = 24;
const params = new URLSearchParams(location.search);
let FOTOS = [], lista = [], cat = params.get("c") || "todas", atual = 0, mostrando = POR_PAGINA, fotoLink = params.get("f");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nome = c => NOMES[c] || (c ? c[0].toUpperCase() + c.slice(1) : "Outras");
// miniaturas leves via Cloudinary (a original só abre no lightbox)
const thumb = (u, w) => /res\.cloudinary\.com/.test(u) && u.includes("/upload/") ? u.replace("/upload/", `/upload/w_${w},q_auto,f_auto/`) : u;

onValue(ref(db, "obpc/galeria_fotos"), snap => {
  FOTOS = Object.entries(snap.val() || {}).map(([k, f]) => ({...f, _k: k})).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  if (cat !== "todas" && !FOTOS.some(f => f.categoria === cat)) cat = "todas";
  filtros(); grade();
  if (fotoLink) { const i = lista.findIndex(f => f._k === fotoLink); fotoLink = null; if (i >= 0) { mostrando = Math.max(mostrando, i + 1); grade(); abrir(i); } }
});

function filtros() {
  const cont = {}; FOTOS.forEach(f => cont[f.categoria] = (cont[f.categoria] || 0) + 1);
  const cats = ["todas", ...Object.keys(cont)];
  $("filtros").innerHTML = cats.map(c => `<button class="filtro ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(nome(c))}<small>${c === "todas" ? FOTOS.length : cont[c]}</small></button>`).join("");
  $("filtros").querySelectorAll(".filtro").forEach(b => b.onclick = () => { cat = b.dataset.c; mostrando = POR_PAGINA; filtros(); grade(); });
}

function grade() {
  lista = cat === "todas" ? FOTOS : FOTOS.filter(f => f.categoria === cat);
  $("vazio").style.display = lista.length ? "none" : "block";
  $("galeria").innerHTML = lista.slice(0, mostrando).map((f, i) =>
    `<div class="card" data-i="${i}"><img src="${esc(thumb(f.url, 500))}" alt="${esc(f.legenda)}" loading="lazy">${f.legenda ? `<div class="leg">${esc(f.legenda)}</div>` : ""}</div>`).join("");
  $("galeria").querySelectorAll(".card").forEach(c => c.onclick = () => abrir(+c.dataset.i));
  $("mais").style.display = lista.length > mostrando ? "block" : "none";
}
$("mais").onclick = () => { mostrando += POR_PAGINA; grade(); };

function abrir(i) { atual = i; mostrar(); $("lb").classList.add("on"); document.body.style.overflow = "hidden"; }
function mostrar() {
  const f = lista[atual]; if (!f) return;
  $("lb-img").src = thumb(f.url, 1400);
  $("lb-leg").textContent = f.legenda || "";
  $("lb-baixar").href = f.url;
}
window.fechar = () => { $("lb").classList.remove("on"); document.body.style.overflow = ""; };
window.nav = d => { atual = (atual + d + lista.length) % lista.length; mostrar(); };

// link curto com prévia da foto (inteira, sem corte): registro em obpc/links + Worker
const WORKER = "https://obpc-og.obpcsaofernando199.workers.dev";
function hash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
window.compartilhar = async () => {
  const f = lista[atual]; if (!f) return;
  const destino = `${location.origin}${location.pathname}?f=${f._k}`;
  const titulo = f.legenda || "Galeria de Fotos — OBPC";
  const rec = {s: "galeria", t: titulo, d: "Veja mais fotos da nossa igreja!", i: f.url, u: destino};
  const code = hash(JSON.stringify(rec));
  set(ref(db, "obpc/links/" + code), rec).catch(() => {});
  const url = `${WORKER}/${code}`;
  if (navigator.share) { try { await navigator.share({title: titulo, text: titulo, url}); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(url); aviso("✓ Link copiado!"); } catch (e) { prompt("Copie o link:", url); }
};
function aviso(t) { const a = $("aviso"); a.textContent = t; a.style.display = "block"; setTimeout(() => a.style.display = "none", 2200); }

document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("on")) return;
  if (e.key === "Escape") fechar(); if (e.key === "ArrowRight") nav(1); if (e.key === "ArrowLeft") nav(-1);
});
$("lb").addEventListener("click", e => { if (e.target.id === "lb") fechar(); });
let x0 = null;
$("lb").addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive: true});
$("lb").addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) nav(dx < 0 ? 1 : -1); });
</script>
</body>
</html>
